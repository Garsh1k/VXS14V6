- type: entity
  parent: BaseComputer
  id: WeaponryControllerConsole
  name: Weaponry controller console
  description: Like a Rolling Stones!
  components:
  - type: StationAiWhitelist
  - type: DeviceList
  - type: DeviceNetwork
    deviceNetId: Wired
  - type: Sprite
    sprite: VXS/Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: aiming_keyboard
    - map: ["computerLayerScreen"]
      state: gun_aiming
    - map: ["computerLayerKeys"]
      state: aiming_key
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: Computer
    board: WeaponryControllerConsoleCircuitboard
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#1f8c28"
  - type: DeviceLinkSource
    range: 20
    ports:
      - TurretControllerSender
  - type: TurretController
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong

- type: entity
  parent: BaseComputerCircuitboard
  id: WeaponryControllerConsoleCircuitboard
  name: Weaponry controller computer board
  description: A computer printed circuit board for weaponry controller computer.
  components:
    - type: Sprite
      state: cpu_syndicate
    - type: ComputerBoard
      prototype: WeaponryControllerConsole
