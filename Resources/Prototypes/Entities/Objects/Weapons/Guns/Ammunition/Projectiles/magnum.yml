- type: entity
  id: BulletMagnum
  name: bullet (.45 magnum)
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 35
  - type: ProjectileInjury
    caliberMultiplier: 1.8

- type: entity
  id: BulletMagnumPractice
  name: bullet (.45 magnum practice)
  parent: BaseBulletPractice
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Blunt: 1
  - type: ProjectileInjury
    caliberMultiplier: 0.3
    minimumDamage: 1.0

- type: entity
  id: BulletMagnumIncendiary
  parent: BaseBulletIncendiary
  name: bullet (.45 magnum incendiary)
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 26
        Heat: 9
  - type: ProjectileInjury
    caliberMultiplier: 2.0

- type: entity
  id: BulletMagnumAP
  name: bullet (.45 magnum armor-piercing)
  parent: BaseBulletAP
  categories: [ HideSpawnMenu ]
