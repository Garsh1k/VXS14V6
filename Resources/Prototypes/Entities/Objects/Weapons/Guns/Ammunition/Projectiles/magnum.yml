    damage:
      types:
        Piercing: 26 # 20% decrease
    ignoreResistances: true
  - type: ProjectileInjury
    caliberMultiplier: 2.2

- type: entity
  id: BulletMagnumUranium
  name: bullet (.45 magnum uranium)
