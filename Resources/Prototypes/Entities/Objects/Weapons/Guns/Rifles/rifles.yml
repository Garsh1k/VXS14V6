  components:
  - type: Sprite
    sprite: VXS/Weapons/lecter.rsi # VXS
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: VXS/Weapons/lecter.rsi # VXS
  - type: MagazineVisuals
