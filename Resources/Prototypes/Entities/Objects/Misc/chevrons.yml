- type: entity
  id: ChevronBase
  name: chevron
  description: A small insignia that can be attached to uniforms to denote rank or position.
  parent: BaseItem
  abstract: true
  components:
  - type: Chevron
  - type: Item
    size: Small

- type: entity
  parent: ChevronBase
  id: ChevronCaptain
  name: captain's chevron
  description: A golden chevron denoting the rank of Captain.
  components:
  - type: Chevron
    chevronInfo: Captain
  - type: Sprite
    sprite: Objects/Misc/chevron.rsi
    state: icon

