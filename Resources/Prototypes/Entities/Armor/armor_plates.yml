# Armor plates that can be inserted into modular armor

- type: entity
  id: ArmorPlateBase
  abstract: true
  name: armor plate
  description: A plate that can be inserted into compatible armor to enhance protection.
  components:
  - type: Sprite
    sprite: Objects/Materials/sheets.rsi
    state: sheet-metal
  - type: Item
    size: Small
  - type: Tag
    tags: [ "ArmorPlate" ]
  - type: ArmorPlate
    coefficients: { }
    flatReductions: { }
    hardResistances: { }
    hardSpendableResistances: { }
    hardSpendablePercentResistances: { }

- type: entity
  parent: ArmorPlateBase
  id: ArmorPlateBlunt
  name: blunt protection plate
  description: A plate that provides additional protection against blunt damage.
  components:
  - type: Sprite
    sprite: Objects/Materials/sheets.rsi
    state: sheet-metal
  - type: ArmorPlate
    coefficients:
      Blunt: 0.8 # 20% additional protection against blunt damage

- type: entity
  parent: ArmorPlateBase
  id: ArmorPlateSlash
  name: slash protection plate
  description: A plate that provides additional protection against slashing damage.
  components:
  - type: Sprite
    sprite: Objects/Materials/sheets.rsi
    state: sheet-metal
  - type: ArmorPlate
    coefficients:
      Slash: 0.8 # 20% additional protection against slashing damage

- type: entity
  parent: ArmorPlateBase
  id: ArmorPlatePiercing
  name: piercing protection plate
  description: A plate that provides additional protection against piercing damage.
  components:
  - type: Sprite
    sprite: Objects/Materials/sheets.rsi
    state: sheet-metal
  - type: ArmorPlate
    coefficients:
      Piercing: 0.7 # 30% additional protection against piercing damage

- type: entity
  parent: ArmorPlateBase
  id: ArmorPlateHeat
  name: heat protection plate
  description: A plate that provides additional protection against heat damage.
  components:
  - type: Sprite
    sprite: Objects/Materials/sheets.rsi
    state: sheet-metal
  - type: ArmorPlate
    coefficients:
      Heat: 0.7 # 30% additional protection against heat damage

- type: entity
  parent: ArmorPlateBase
  id: ArmorPlateUniversal
  name: universal protection plate
  description: A plate that provides balanced protection against all damage types.
  components:
  - type: Sprite
    sprite: Objects/Materials/sheets.rsi
    state: sheet-metal
  - type: ArmorPlate
    coefficients:
      Blunt: 0.9
      Slash: 0.9
      Piercing: 0.9
      Heat: 0.9

# Example plates with flat reductions
- type: entity
  parent: ArmorPlateBase
  id: ArmorPlateBluntFlat
  name: blunt flat reduction plate
  description: A plate that provides flat damage reduction against blunt damage.
  components:
  - type: Sprite
    sprite: Objects/Materials/sheets.rsi
    state: sheet-metal
  - type: ArmorPlate
    flatReductions:
      Blunt: 5.0 # 5 flat damage reduction against blunt damage

# Example plates with hard resistances
- type: entity
  parent: ArmorPlateBase
  id: ArmorPlatePiercingHard
  name: piercing hard resistance plate
  description: A plate that provides hard resistance against piercing damage.
  components:
  - type: Sprite
    sprite: Objects/Materials/sheets.rsi
    state: sheet-metal
  - type: ArmorPlate
    hardResistances:
      Piercing: 10.0 # 10 points of hard resistance against piercing damage

# Example plates with hard-spendable resistances
- type: entity
  parent: ArmorPlateBase
  id: ArmorPlateHeatSpendable
  name: heat hard-spendable resistance plate
  description: A plate that provides hard-spendable resistance against heat damage.
  components:
  - type: Sprite
    sprite: Objects/Materials/sheets.rsi
    state: sheet-metal
  - type: ArmorPlate
    hardSpendableResistances:
      Heat: 15.0 # 15 points of hard-spendable resistance against heat damage

# Example plates with hard-spendable percent resistances
- type: entity
  parent: ArmorPlateBase
  id: ArmorPlateSlashPercent
  name: slash hard-spendable percent resistance plate
  description: A plate that provides hard-spendable percent resistance against slashing damage.
  components:
  - type: Sprite
    sprite: Objects/Materials/sheets.rsi
    state: sheet-metal
  - type: ArmorPlate
    hardSpendablePercentResistances:
      Slash: 0.25 # 25% of damage consumed as hard-spendable percent resistance against slashing damage

- type: entity
  parent: ArmorPlateBase
  id: ArmorPlateSlashPercentAAAAAAA
  name: AAAAAAAAAAAA
  description: A plate that provides hard-spendable percent resistance against slashing damage.
  components:
  - type: Sprite
    sprite: Objects/Materials/sheets.rsi
    state: sheet-metal
  - type: ArmorPlate
    hardSpendablePercentResistances:
      Piercing: 0.80
