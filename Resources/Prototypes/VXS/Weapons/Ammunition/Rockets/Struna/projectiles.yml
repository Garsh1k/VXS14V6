- type: entity
  id: BulletRocketAntiShipStrunaNuclear
  name: STRING NUCLEAR (IR)
  parent: BaseBulletRocketAntiShip
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: VXS/Weapons/Ammunition/Explosives/struna.rsi
    layers:
      - state: nuclear
  - type: RadarMarker
    color: Red
    shape: Triangle
    showName: true
  - type: TimedDespawn
    lifetime: 50
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Projectile
    damage:
      types:
        Blunt: 50
        Structural: 500
    deleteOnCollide: true
  - type: VXSActiveThrusterRadioHeading
    seekRange: 100
    rotationSpeed: 10
    guidanceAlgorithm: PurePursuit
    acceleration: 15
    topSpeed: 100
    initialSpeed: 50
    FOV: 60
    retargetWindow: 4
