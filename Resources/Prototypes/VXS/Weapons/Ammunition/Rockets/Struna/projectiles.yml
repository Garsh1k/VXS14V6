- type: entity
  id: BulletRocketAntiShipStrunaHE
  name: STRING HE (IR)
  parent: BaseBulletRocketAntiShip
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: VXS/Weapons/Ammunition/Explosives/struna.rsi
    layers:
      - state: he
  - type: RadarMarker
    color: Red
    shape: Triangle
    showName: true
  - type: Explosive
    explosionType: HardBomb
    maxIntensity: 50
    intensitySlope: 16
    totalIntensity: 600
  - type: TimedDespawn
    lifetime: 50
  - type: VXSActiveThrusterRadioHeading
    seekRange: 100
    rotationSpeed: 10
    guidanceAlgorithm: PurePursuit
    acceleration: 15
    topSpeed: 100
    initialSpeed: 50
    FOV: 60
    retargetWindow: 4
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]

