- type: entity
  id: WeaponRocketAntiShipStrunaHE
  name: SSR-800IRH String # ХЕ
  parent: BaseWeaponRocketAntiShip
  description: Short-range anti-ship missile with infrared-guided basic guidance head. Designed to defeat large ships in close maneuver combat. One of these things will tear the hull of medium armored ships.
  components:
  - type: Sprite
    sprite: VXS/Weapons/Ammunition/Explosives/struna.rsi
    state: he
  - type: StaticPrice
    price: 1000
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 100
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
      - trigger:
          !type:DamageTrigger
          damage: 50
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:ExplodeBehavior
          - !type:SpawnEntitiesBehavior
            spawn:
              ScrapGlass:
                min: 1
                max: 1
              ScrapSteel:
                min: 1
                max: 2
  - type: BallisticAmmoProvider
    cycleable: false
    whitelist:
      entities:
        - CartridgeRocketAntiShipStrunaHE
    capacity: 1
    proto: CartridgeRocketAntiShipStrunaHE
  - type: WeaponMonitoringProfile
    category: AntiShipMissile
    fov: 60
    seekerType: Infrared
    warheadType: HE
    flightTime: 0
    deviation: 0
    projectileSpeed: 100
    notes: Effectively engages naval targets at short ranges.

- type: entity
  id: WeaponRocketAntiShipStrunaEMP
  name: SSR-806IRHEM Arc # ЭМИ
  parent: BaseWeaponRocketAntiShip
  description: Short-range anti-ship missile with infrared-guided basic guidance head. It's literally a string, but instead of a HE warhead, it's an EMP warhead. It is designed to disable the external equipment of large ships and the wiring of small ships.
  components:
  - type: Sprite
    sprite: VXS/Weapons/Ammunition/Explosives/struna.rsi
    state: emp
  - type: StaticPrice
    price: 1200
  - type: Explosive
    explosionType: Default
    totalIntensity: 100
    intensitySlope: 5
    maxIntensity: 4
  - type: Gun
    projectileSpeed: 60
    fireRate: 1
    minAngle: 0
    maxAngle: 1
    soundGunshot:
      path: /Audio/Effects/explosion_small3.ogg
      params:
        pitch: 0.8
        volume: 5
  - type: BallisticAmmoProvider
    cycleable: false
    whitelist:
      entities:
        - CartridgeRocketAntiShipStrunaEMP
    capacity: 1
    proto: CartridgeRocketAntiShipStrunaEMP
  - type: WeaponMonitoringProfile
    category: AntiShipMissile
    fov: 60
    seekerType: Infrared
    warheadType: EMP
    flightTime: 0
    deviation: 0
    projectileSpeed: 100
    notes: Effectively engages naval targets at short ranges.

