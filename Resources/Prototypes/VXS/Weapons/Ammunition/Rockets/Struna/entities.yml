- type: entity
  id: WeaponRocketAntiShipStrunaNuclear
  name: SSR-20ARHN Mint # Ядерный
  parent: BaseWeaponRocketAntiShip
  description: Medium-range anti-ship missile with active radar guidance and a low-yield thermonuclear warhead. No IFF system, weak radioactive emission after hitting the target, fast speed, low maneuverability. Usually after this missile hits its target, it disappears from radar.
  components:
  - type: Sprite
    sprite: VXS/Weapons/Ammunition/Explosives/struna.rsi
    state: nuclear
  - type: StaticPrice
    price: 15000
  - type: Explosive
    explosionType: Default
    totalIntensity: 200
    intensitySlope: 5
    maxIntensity: 4
  - type: Gun
    projectileSpeed: 150
    fireRate: 1
    minAngle: 0
    maxAngle: 0
    soundGunshot:
      path: /Audio/Effects/explosion_small3.ogg
      params:
        pitch: 0.8
        volume: 5
  - type: BallisticAmmoProvider
    cycleable: false
    whitelist:
      entities:
        - CartridgeRocketAntiShipStrunaNuclear
    capacity: 1
    proto: CartridgeRocketAntiShipStrunaNuclear
  - type: RadiationSource
    slope: 0.3
    intensity: 0.6
  - type: WeaponMonitoringProfile
    category: AntiShipMissile
    fov: 60
    seekerType: Infrared
    warheadType: HE
    flightTime: 0
    deviation: 0
    projectileSpeed: 100
    notes: Effectively engages naval targets at short ranges. Usage of this missile is considered a war crime.


