- type: entity
  id: BulletRocketAntiShipHostaHE
  name: HOSTA HE (ARH)
  parent: BaseBulletRocketAntiShip
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: VXS/Weapons/Ammunition/Explosives/hosta.rsi
    layers:
      - state: he
  - type: Explosive
    explosionType: HardBomb
    maxIntensity: 50
    intensitySlope: 10
    totalIntensity: 600
  - type: RadarMarker
    color: Red
    shape: Triangle
    showName: true
  - type: MinimumDistanceTriggerCondition
    minimumDistanceTiles: 10
  - type: TimedDespawn
    lifetime: 100
  - type: VXSActiveRadioHeading
    seekRange: 500
    rotationSpeed: 3
    guidanceAlgorithm: PredictiveGuidance
    acceleration: 5
    topSpeed: 125
    initialSpeed: 20
    FOV: 50
    lockedIn: true
  - type: VXSCountermeasureResistance
    type: InertialFlight
    inertialFlightDuration: 4
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]

