- type: entity
  id: BulletRocketAntiShipSwitchbladeHE
  name: ASM-875T Switchblade
  parent: BaseBulletRocketAntiShip
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: VXS/Weapons/Ammunition/Explosives/switchblade.rsi
    layers:
      - state: he
  - type: RadarMarker
    color: Red
    shape: Circle
  - type: MinimumDistanceTriggerCondition
    minimumDistanceTiles: 4
  - type: TimedDespawn
    lifetime: 50
  - type: Projectile
    damage:
      types:
        Blunt: 200
        Structural: 2000
    penetrationThreshold: 1000
    penetrationDamageTypeRequirement:
    - Structural
    deleteOnCollide: false
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: TwoStageTrigger
    triggerDelay: 0.1
    components:
      - type: ExplodeOnTrigger
      - type: Explosive
        explosionType: HardBomb
        maxIntensity: 100
        intensitySlope: 35
        totalIntensity: 350

