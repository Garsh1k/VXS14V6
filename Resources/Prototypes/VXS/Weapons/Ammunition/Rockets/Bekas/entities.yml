- type: entity
  id: WeaponRocketAntiShipBekasC
  name: ARR AR Bekas-C # Совмещенный
  parent: BaseWeaponRocketAntiShip
  description: Long-range anti-radar missile. This one - combined warhead.
  components:
  - type: Sprite
    sprite: VXS/Weapons/Ammunition/Explosives/bekas.rsi
    state: he
  - type: StaticPrice
    price: 3000
  - type: Explosive
    explosionType: Default
    totalIntensity: 500
    intensitySlope: 1
    maxIntensity: 50
  - type: WeaponMonitoringProfile
    category: AntiShipMissile
    fov: 40
    seekerType: Antiradar
    warheadType: EMP and HE
    flightTime: 0
    deviation: 0
    projectileSpeed: 60
    notes: It locks onto the radar signal from the enemy ship's shuttle control console. It is an extremely slow and fast missile, but the self-destruct mechanism does not activate until 10 minutes have passed.
  - type: Gun
    projectileSpeed: 60
    fireRate: 1
    minAngle: 0
    maxAngle: 1
    soundGunshot:
      path: /Audio/Effects/explosion_small3.ogg
      params:
        pitch: 0.8
        volume: 5
  - type: BallisticAmmoProvider
    cycleable: false
    whitelist:
      entities:
        - CartridgeRocketAntiShipBekasC
    capacity: 1
    proto: CartridgeRocketAntiShipBekasC

