- type: entity
  id: BulletRocketAntiShipBekasC
  name: BEKAS C (PRH)
  parent: BaseBulletRocketAntiShip
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: VXS/Weapons/Ammunition/Explosives/bekas.rsi
    layers:
      - state: he
  - type: RadarMarker
    color: Red
    shape: Triangle
    showName: true
  - type: Explosive
    explosionType: HardBomb
    maxIntensity: 50
    intensitySlope: 10
    totalIntensity: 1000
  - type: EmpOnTrigger
    range: 8
    energyConsumption: 10000
    disableDuration: 30
  - type: TimedDespawn
    lifetime: 600
  - type: PassiveRadioHeading
    seekRange: 1000
    rotationSpeed: 0.5
    guidanceAlgorithm: PurePursuit
    acceleration: 10
    topSpeed: 100
    initialSpeed: 30
    FOV: 40
    lockedIn: false
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]

