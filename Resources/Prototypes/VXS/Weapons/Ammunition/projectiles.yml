# Rockets / Grenades
- type: entity
  id: BulletRocketFugas
  name: rocket
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
      - state: fugas
  - type: ExplodeOnTrigger
  - type: MinimumDistanceTriggerCondition
    minimumDistanceTiles: 4
  - type: Explosive
    explosionType: DemolitionCharge
    maxIntensity: 17
    intensitySlope: 800
    totalIntensity: 50
    maxTileBreak: 1
  - type: SmokeOnTrigger
    duration: 2
    spreadAmount: 3
  - type: FlashOnTrigger
    range: 5
  - type: ProjectileGrenade
    fillPrototype: PelletFugasStruya
    capacity: 1
    randomAngle: false
    triggerKey: trigger
    MaxVelocity: 20
    MinVelocity: 20
  - type: Projectile
    damage:
      types:
        Blunt: 40
    penetrationThreshold: 1000
    penetrationDamageTypeRequirement:
    - Structural

- type: entity
  id: PelletFugasStruya
  name: pellet
  categories: [ HideSpawnMenu ]
  parent: BaseBullet
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    state: buckshot
  - type: Projectile
    deleteOnCollide: false
    damage:
      types:
        Blunt: 30
        Piercing: 100
  - type: StaminaDamageOnCollide
    damage: 99
  - type: TimedDespawn
    lifetime: 0.1

- type: entity
  id: BulletRocketThermobar
  name: rocket
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
      - state: frag
  - type: MinimumDistanceTriggerCondition
    minimumDistanceTiles: 4
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Thermobaric
    maxIntensity: 45
    intensitySlope: 1
    totalIntensity: 300
    maxTileBreak: 1
  - type: SmokeOnTrigger
    duration: 6
    spreadAmount: 6
  - type: FlashOnTrigger
    range: 8

- type: entity
  id: BulletRocketFrag
  name: rocket
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
      - state: frag
  - type: MinimumDistanceTriggerCondition
    minimumDistanceTiles: 4
  - type: SmokeOnTrigger
    duration: 3
    spreadAmount: 6
  - type: FlashOnTrigger
    range: 4
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    maxIntensity: 20
    intensitySlope: 2
    totalIntensity: 60
  - type: ContainerContainer
    containers:
      cluster-payload: !type:Container
  - type: ProjectileGrenade
    triggerKey: trigger
    fillPrototype: PelletClusterLethalHeavy
    capacity: 40
    randomAngle: true
    MaxVelocity: 18
    MinVelocity: 10

# Sniper

- type: entity
  categories: [ HideSpawnMenu ]
  parent: BaseBullet
  id: BulletSniperTrasser
  name: bullet (.338 magnum)
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 75
        Blunt: 35
        Structural: 30
    penetrationThreshold: 100
    penetrationDamageTypeRequirement:
    - Structural
    traumaCoefficient: 2.5
  - type: StaminaDamageOnCollide
    damage: 45
  - type: ProjectileTileDamageFalloff
    damageReductions:
      Piercing: 0.2
      Blunt: 0.2
  - type: ProjectileTileStaminaFalloff
    damageReductionPerTile: 1
  - type: StunOnCollide
    stunAmount: 0
    knockdownAmount: 2.5
    drop: false
    slowdownAmount: 2.5
    walkSpeedModifier: 0.1
    sprintSpeedModifier: 0.1
  - type: TimedDespawn
    lifetime: 25
  - type: Sprite
    noRot: false
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
    - state: marksman
      shader: unshaded

