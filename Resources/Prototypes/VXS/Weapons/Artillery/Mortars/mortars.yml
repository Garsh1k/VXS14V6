- type: entity
  id: DebugMortar
  parent: BaseStructure
  name: Mortar
  suffix: DEBUG
  description: pizdec
  components:
  - type: Sprite
    sprite: VXS/Structures/mortar.rsi
    state: mortar
  - type: Mortar
    accuracy: 0.5
    minOffsetX: -50
    maxOffsetX: 50
    minOffsetY: -50
    maxOffsetY: 50
    minSafeDistance: 5
  - type: ContainerContainer
    containers:
      mortar_chamber: !type:ContainerSlot
  - type: ItemSlots
    slots:
      mortar_chamber:
        name: Chamber
        startingItem: DebugMortarShell
        priority: 1
        whitelist:
          tags:
            - MortarShell
