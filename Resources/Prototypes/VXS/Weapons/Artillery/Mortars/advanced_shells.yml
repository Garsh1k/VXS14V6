# Advanced mortar shells that spawn entities instead of direct explosions

- type: entity
  id: SmokeMortarShell
  parent: DebugMortarShell
  name: Smoke Mortar Shell
  description: A mortar shell that deploys smoke on impact
  components:
  - type: MortarShell
    delayPerTile: 0.15
    fireSound: /Audio/Weapons/Guns/Artillery/fire1.ogg
    preExplosionSound: /Audio/Weapons/Guns/Artillery/mortarflyby.ogg
    insertSound: /Audio/Weapons/Guns/Artillery/mortarload.ogg
    explosionEntity: Smoke
    useDirectExplosion: false
  - type: Tag
    tags:
    - MortarShell

