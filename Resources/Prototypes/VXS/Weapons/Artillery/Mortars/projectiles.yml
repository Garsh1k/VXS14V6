
- type: entity
  id: ArtilleryMarkerFrag82mm
  categories: [ HideSpawnMenu ]
  name: artillery strike 82mm frag
  components:
  - type: Sprite
    sprite: /Textures/Objects/Fun/goldbikehorn.rsi
    visible: false
    state: icon
  - type: TriggerOnSpawn
  - type: DeleteOnTrigger
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    totalIntensity: 60
    intensitySlope: 4
    maxIntensity: 8
  - type: ContainerContainer
    containers:
      cluster-payload: !type:Container
  - type: ProjectileGrenade
    triggerKey: trigger
    fillPrototype: PelletClusterLethalSmall
    capacity: 30

- type: entity
  id: ArtilleryMarkerSmoke82mm
  categories: [ HideSpawnMenu ]
  name: artillery strike 82mm smoke
  components:
  - type: Sprite
    sprite: /Textures/Objects/Fun/goldbikehorn.rsi
    visible: false
    state: icon
  - type: TriggerOnSpawn
  - type: DeleteOnTrigger
  - type: SmokeOnTrigger
    keysIn:
    - timer
    duration: 30
    spreadAmount: 50
  - type: EmitSoundOnTrigger
    keysIn:
    - timer
    sound: /Audio/Items/smoke_grenade_smoke.ogg
    positional: true

- type: entity
  id: ArtilleryMarkerEMP82mm
  categories: [ HideSpawnMenu ]
  name: artillery strike 82mm emp
  components:
  - type: Sprite
    sprite: /Textures/Objects/Fun/goldbikehorn.rsi
    visible: false
    state: icon
  - type: TriggerOnSpawn
  - type: DeleteOnTrigger
  - type: EmpOnTrigger
    range: 5
    energyConsumption: 10000
    disableDuration: 5
