- type: entity
  id: ArmorPlateBase
  parent: BaseItem
  abstract: true
  name: armor plate
  description: A plate that can be inserted into compatible armor to enhance protection.
  components:
  - type: Item
    size: Small
  - type: Tag
    tags: [ "ArmorPlate" ]
  - type: ArmorPlate
    coefficients: { }
    flatReductions: { }
    hardResistances: { }
    hardSpendableResistances: { }
    hardSpendablePercentResistances: { }

- type: entity
  parent: ArmorPlateBase
  id: ArmorPlateZabralo
  name: Zabralo-2R armor plate
  suffix: 2R
  description: General military armor plate, protects vital organs from rifle bullets and shrapnel. Having proven its quality time and time again, this armor plate has become a classic of the genre due to its fairly low cost relative to quality.
  components:
  - type: Sprite
    sprite: VXS/Objects/armorplates.rsi
    state: icon
  - type: StaticPrice
    price: 1200
  - type: ArmorPlate
    flatReductions:
      Blunt: 5.0
      Piercing: 5.0
    hardSpendableResistances:
      Piercing: 50
    coefficients:
      Slash: 0.9
      Heat: 0.9

- type: entity
  parent: ArmorPlateBase
  id: ArmorPlateZabraloMod
  name: Zabralo-3R2 armor plate
  suffix: 3R2
  description: General military armor plate, protects vital organs from rifle bullets and shrapnel. Having proven its quality time and time again, this armor plate has become a classic of the genre due to its fairly low cost relative to quality. Specifically this model is lightweight and has more Kevlar around the edges of the armor plate.
  components:
  - type: Sprite
    sprite: VXS/Objects/armorplates.rsi
    state: icon2
  - type: StaticPrice
    price: 1200
  - type: ArmorPlate
    flatReductions:
      Blunt: 5.0
      Piercing: 15.0
    hardSpendableResistances:
      Piercing: 20
    coefficients:
      Slash: 0.8
      Heat: 0.9
