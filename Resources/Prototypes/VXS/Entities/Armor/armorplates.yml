- type: entity
  id: ArmorPlateBase
  parent: BaseItem
  abstract: true
  name: armor plate
  description: A plate that can be inserted into compatible armor to enhance protection.
  components:
  - type: Item
    size: Small
  - type: Tag
    tags: [ "ArmorPlate" ]
  - type: ArmorPlate
    coefficients: { }
    flatReductions: { }
    hardResistances: { }
    hardSpendableResistances: { }
    hardSpendablePercentResistances: { }

- type: entity
  parent: ArmorPlateBase
  id: ArmorPlateZabralo
  name: Zabralo SAPIv4 armor plate
  description: General military armor plate, protects vital organs from rifle bullets and shrapnel.
  components:
  - type: Sprite
    sprite: VXS/Objects/armorplates.rsi
    state: icon
  - type: StaticPrice
    price: 1200
  - type: ArmorPlate
    flatReductions:
      Blunt: 5.0
      Piercing: 5.0
    hardSpendableResistances:
      Piercing: 50
    coefficients:
      Slash: 0.9
      Heat: 0.9

- type: entity
