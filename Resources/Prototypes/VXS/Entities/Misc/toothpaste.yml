- type: entity
  parent: BaseItem
  id: ToothpasteBottleDracosha
  name: drakosha toothpaste
  description: Do not consume. Your stomatch will hurt.
  components:
  - type: DrawableSolution
    solution: food
  - type: DrainableSolution
    solution: food
  - type: ExaminableSolution
    solution: food
  - type: Edible
    edible: Drink
    solution: food
    destroyOnEmpty: false
    utensil: None
  - type: Openable
    sound:
      collection: pop
    closeable: true
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: ToothpasteDrakosha
          Quantity: 30
  - type: Sprite
    sprite: VXS/Misc/toothpaste.rsi
    state: dracosha
  - type: Item
    size: Small

- type: reagent
  id: ToothpasteDrakosha
  name: toothpaste
  group: Foods
  desc: wowza
  physicalDesc: reagent-physical-desc-gloopy
  flavor: sweet
  color: pink
  recognizable: false

- type: entity
  parent: BaseItem
