- type: entity
  id: ArtilleryDetector
  parent: BaseStructureDynamic
  name: artdet
  abstract: true
  components:
  - type: InteractionOutline
  - type: ArtilleryDetector
  - type: Appearance
  - type: Sprite
    sprite: SimpleStation14/Structures/Furniture/Benches/steel_bench.rsi
    state: middle
  - type: ApcPowerReceiver
  - type: ExtensionCableReceiver
  - type: Anchorable
  - type: Pullable
  - type: DeviceNetwork
    deviceNetId: Wired
    receiveFrequencyId: BasicDevice
    transmitFrequencyId: BasicDevice
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Electronic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
          params:
            volume: -4
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 2
            max: 4
  - type: Transform
    anchored: true

- type: entity
  id: ArtilleryDetectorMonologue
  parent: ArtilleryDetector
  name: 51E3P1 Monologue
  suffix: Poor and shitty
  description: "Дешёвая переносная звукометрическая установка обнаружения и целеуказания. Применяется для контрбатарейной борьбы."
  components:
  - type: ArtilleryDetector
    detectionRadius: 100
    detectionDelay: 10
    accuracyX: 10
    accuracyY: 10
    showArtilleryType: false
    showProjectileType: false
  - type: Transform
    anchored: false
  - type: Sprite
    sprite: VXS/Structures/rls.rsi
    state: furke
  - type: ApcPowerReceiver
    powerLoad: 100
  - type: Anchorable
    delay: 1

- type: entity
  id: ArtilleryDetectorTavolga
  parent: ArtilleryDetector
  name: 51E3P23M Tavolga
  suffix: Cool and costly
  description: "Дорогущая переносная РЛС контрбатарейной борьбы."
  components:
  - type: ArtilleryDetector
    detectionRadius: 2500
    detectionDelay: 1
    accuracyX: 1
    accuracyY: 1
    showArtilleryType: true
    showProjectileType: true
  - type: Transform
    anchored: false
  - type: Sprite
    sprite: VXS/Structures/rls.rsi
    state: lev
  - type: ApcPowerReceiver
    powerLoad: 3500
  - type: Anchorable
    delay: 20

- type: entity
  id: ArtilleryDetectionConsole
  parent: BaseComputer
  name: artillery fire journal console
  description: I am too lazy
  components:
  - type: ArtilleryDetectionConsole
  - type: Computer
    board: ArtilleryDetectionConsoleCircuitboard
  - type: Sprite
    sprite: VXS/Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: aiming_keyboard
    - map: ["computerLayerScreen"]
      state: gun_aiming
    - map: ["computerLayerKeys"]
      state: aiming_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: ActivatableUI
    singleUser: false
    key: enum.ArtilleryDetectionConsoleUiKey.Key
  - type: DeviceNetwork
    deviceNetId: Wired
    receiveFrequencyId: BasicDevice
    transmitFrequencyId: BasicDevice
  - type: UserInterface
    interfaces:
      enum.ArtilleryDetectionConsoleUiKey.Key:
        type: ArtilleryDetectionConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
