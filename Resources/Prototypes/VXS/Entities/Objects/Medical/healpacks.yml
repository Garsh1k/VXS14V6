- type: entity
  name: Cohesive dressing pack
  suffix: VXMED
  description: Sterile self-tightening bandage with two pads for wound immobilization and protection.
  parent: BaseHealingItem
  id: GauzeCohesiveVX
  components:
  - type: Tag
    tags:
    - Gauze
  - type: Sprite
    sprite: VXS/Objects/Medical/medical.rsi
    state: gauze
  - type: Item
  - type: Healing
    delay: 4
    damageContainers:
      - Biological
    damage:
      types:
        Slash: -5
        Piercing: -5
    bloodlossModifier: -3
    healingBeginSound:
      path: "/Audio/Items/Medical/brutepack_begin.ogg"
      params:
        volume: 1.0
        variation: 0.125
    healingEndSound:
      path: "/Audio/Items/Medical/brutepack_end.ogg"
      params:
        volume: 1.0
        variation: 0.125
  - type: Tending
    woundWhitelist:
      tags: [WoundCut, WoundPuncture]
    damage:
      types:
        Slash: -5
        Piercing: -5
    tendingBeginSound:
      path: "/Audio/Items/Medical/brutepack_begin.ogg"
      params:
        volume: 1.0
        variation: 0.125
    tendingEndSound:
      path: "/Audio/Items/Medical/brutepack_end.ogg"
      params:
        volume: 1.0
        variation: 0.125

