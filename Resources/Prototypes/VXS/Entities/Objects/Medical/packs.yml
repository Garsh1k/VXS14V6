- type: entity
  id: ADTBasePack
  parent: BaseStorageItem
  description: Holds up to 10 pills.
  abstract: true
  components:
  - type: Sprite
    sprite: VXS/Objects/Medical/packs.rsi
    state: pack
  - type: Item
    sprite: VXS/Objects/Medical/packs.rsi
    size: Small
  - type: Tag
    tags:
      - PillCanister
  - type: Storage
    grid:
    - 0,0,4,1
    whitelist:
      components:
      - Pill

- type: entity
  id: ADTPillPack
  name: pill pack
  parent: ADTBasePack

- type: entity
  name: charcoal pill packet
  suffix: VXMED
  id: CharcoalPillPack
  parent: ADTPillPack
  components:
  - type: Sprite
    sprite: VXS/Objects/Medical/packs.rsi
    state: charcoal
  - type: Item
    sprite: VXS/Objects/Medical/packs.rsi
  - type: StorageFill
    contents:
      - id: PillCharcoal
        amount: 10

- type: entity
  name: sorbex pill packet
  suffix: VXMED
  id: SorbexPillPack
  parent: ADTPillPack
  components:
  - type: Sprite
    sprite: VXS/Objects/Medical/packs.rsi
    state: ethylredoxrazine
  - type: Item
    sprite: VXS/Objects/Medical/packs.rsi
  - type: StorageFill
    contents:
      - id: PillSorbex
        amount: 10
