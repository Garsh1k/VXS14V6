# Military Equipment Crates for VXS14

# Mortar 82mm Ammunition Crate
- type: entity
  id: CrateMortar82mm
  parent: CrateGenericSteel
  name: mortar ammunition crate
  description: A crate of 82mm mortar shells. Handle with care!
  components:
  - type: Icon
    sprite: Structures/Storage/Crates/plasma.rsi
  - type: Sprite
    sprite: Structures/Storage/Crates/plasma.rsi
  - type: StorageFill
    contents:
      - id: MortarFragShell
        amount: 4

