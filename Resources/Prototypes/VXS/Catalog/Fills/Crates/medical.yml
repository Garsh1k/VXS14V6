# Medical Supply Crates for VXS14

# Saline Solution Crate (Medical)
- type: entity
  id: CrateSalineSolution
  parent: CrateFreezer
  name: saline solution crate
  description: A crate containing IV bags of sterile saline solution for medical use.
  components:
  - type: StorageFill
    contents:
      - id: IVBagSalinesolution
        amount: 2

